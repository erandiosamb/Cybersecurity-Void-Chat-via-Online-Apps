<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Private Chat</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #121212; color: white; }
        .container { max-width: 500px; margin: auto; }
        textarea, input { width: 100%; margin: 10px 0; padding: 10px; border-radius: 5px; border: 1px solid #333; background: #222; color: rgb(0, 255, 255); box-sizing: border-box; }
        button { width: 48%; padding: 15px; cursor: pointer; background: #007bff; color: white; border: none; border-radius: 5px; }
        .output { background: #000; padding: 15px; border: 1px dashed #555; word-break: break-all; margin-top: 20px; color: rgb(0, 255, 255); }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js"></script>
</head>
<body>
    <div class="container">
        <h2>🛡️ Private Chat</h2>
        <input type="password" id="passphrase" placeholder="Write your keyphrase here">
        <textarea id="message" rows="4" placeholder="Paste the message here..."></textarea>
        
        <div style="display: flex; justify-content: space-between;">
            <button onclick="processMessage(true)">Encrypt</button>
            <button onclick="processMessage(false)" style="background: #1c2892;">Decrypt</button>
        </div>

        <div class="output" id="result">Encrypted or decrypted message will appear here...</div>
    </div>

    <script>
        function processMessage(isEncrypting) {
            const passphrase = document.getElementById('passphrase').value;
            const text = document.getElementById('message').value;
            
            if(!passphrase || !text) return alert("Fill in all fields");

            try {
                if (isEncrypting) {
                    // Ciframos usando AES estándar compatible con cualquier dispositivo de forma local
                    const encrypted = CryptoJS.AES.encrypt(text, passphrase).toString();
                    document.getElementById('result').innerText = encrypted;
                } else {
                    // Desciframos el texto
                    const bytes = CryptoJS.AES.decrypt(text, passphrase);
                    const decryptedText = bytes.toString(CryptoJS.enc.Utf8);
                    
                    if (!decryptedText) {
                        throw new Error("Invalid password");
                    }
                    
                    document.getElementById('result').innerText = decryptedText;
                }
            } catch (e) {
                document.getElementById('result').innerText = "Error: Incorrect password/Corrupted data.";
            }
        }
    </script>
</body>
</html>
